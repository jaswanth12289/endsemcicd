name: CI/CD — Build & Deploy Frontend

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            build
            dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (for deploy)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: DEBUG — Workspace contents (top-level)
        run: |
          echo "=== WORKSPACE ==="
          pwd
          ls -la
          echo "=== WORKFLOW FILES (.github) ==="
          ls -la .github || true

      - name: DEBUG — Check .git & git version
        run: |
          echo "git version:" && git --version || true
          echo "ls -la .git (exists?)"
          if [ -d ".git" ]; then echo ".git exists"; ls -la .git | head -n 20; else echo ".git NOT found"; fi
          echo "git rev-parse (show top-level) (may fail):"
          git rev-parse --show-toplevel || true
          echo "git status (may fail):"
          git status --porcelain --untracked-files=all || true

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: DEBUG — After download list files
        run: |
          echo "=== AFTER DOWNLOAD ==="
          pwd
          ls -la
          echo "Contents of current directory (first 200 lines):"
          find . -maxdepth 2 -print | sed -n '1,200p'

      - name: Normalize build folder
        run: |
          if [ -d "dist" ]; then mv dist build; fi
          if [ ! -d "build" ]; then echo "No build output found! Listing repo:" && ls -la && exit 1; fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
