name: CI/CD — Build & Deploy Frontend

# grant the token explicit permissions needed for deployment
permissions:
  contents: write    # allow pushing the gh-pages branch
  pages: write       # allow Pages API actions (if needed)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            build
            dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: Normalize build folder
        run: |
          if [ -d "dist" ]; then mv dist build; fi
          if [ ! -d "build" ]; then echo "No build output found! Listing repo:" && ls -la && exit 1; fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
